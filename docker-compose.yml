version: '3.8'

services:
  # --- СУБД: ОБЩАЯ БАЗА ДАННЫХ ДЛЯ ВСЕХ СЕРВИСОВ ---
  db:
    image: mariadb:10.11
    container_name: migration_mariadb
    restart: always
    command: --transaction-isolation=READ-COMMITTED --log-bin=ROW
    volumes:
      - ./data/mysql:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=F@il2511
    networks:
      - migration_net

  # --- ВЕБ-ПРОКСИ И SSL-МЕНЕДЖЕР (Nginx Proxy Manager) ---
  proxy:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: migration_proxy
    restart: always
    ports:
      - '80:80'
      - '443:443'
      - '81:81' # Админка прокси
    volumes:
      - ./data/npm/data:/data
      - ./data/npm/letsencrypt:/etc/letsencrypt
    networks:
      - migration_net

  # --- ОБЛАЧНОЕ ХРАНИЛИЩЕ NEXTCLOUD ---
  nextcloud:
    image: nextcloud:stable
    container_name: migration_nextcloud
    restart: always
    ports:
      - '8080:80'
    depends_on:
      - db
    volumes:
      - ./data/nextcloud/html:/var/www/html
      - ./data/nextcloud/data:/var/www/html/data
    environment:
      - MYSQL_HOST=db
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=root
      - MYSQL_PASSWORD=F@il2511
    networks:
      - migration_net

  # --- ТЕЛЕФОНИЯ FREEPBX / ASTERISK ---
  freepbx:
    image: tiredofit/freepbx:latest
    container_name: migration_freepbx
    restart: always
    ports:
      - '5060:5060/udp'
      - '5160:5160/udp'
      - '10000-10100:10000-10100/udp'
      - '8888:80'
    volumes:
      - ./data/asterisk/etc:/etc/asterisk
      - ./data/asterisk/var_log:/var/log/asterisk
      - ./data/asterisk/spool:/var/spool/asterisk
      - ./data/asterisk/modules:/usr/lib/asterisk/modules
    environment:
      - DB_HOST=db
      - DB_NAME=asterisk
      - DB_USER=root
      - DB_PASS=F@il2511
    network_mode: "host"

  # --- ПОЧТОВЫЙ СЕРВЕР (Для ретро-миграций) ---
  mail:
    image: tvial/docker-mailserver:latest
    container_name: migration_mail
    restart: always
    ports:
      - "25:25"
      - "143:143"
      - "587:587"
      - "993:993"
    volumes:
      - ./data/mail/config:/tmp/docker-mailserver
      - ./data/mail/maildir:/var/mail
    environment:
      - ENABLE_POSTFIX=1
      - ENABLE_DOVECOT=1
    networks:
      - migration_net

  # --- СТАРЫЙ ВЕБ-СЕРВЕР ДЛЯ ПОДНЯТИЯ НАЙДЕННЫХ САЙТОВ ---
  web_legacy:
    image: webdevops/php-nginx:7.4 # PHP 7.4 наиболее всеяден для старых сайтов 2012 года
    container_name: migration_web_legacy
    restart: always
    volumes:
      - ./data/www/html:/app # Сюда скрипт автоматически распакует старые сайты
      - ./data/www/old_configs:/opt/old_configs # Копия старых конфигов Nginx/Apache для сверки
    environment:
      - WEB_DOCUMENT_ROOT=/app
    networks:
      - migration_net

networks:
  migration_net:
    driver: bridge
